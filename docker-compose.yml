name: docdeploy

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: docdeploy-api:local
    environment:
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: docdeploy-worker:local
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped
