name: docdeploy

services:
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: docdeploy-api:local
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_APP_USER:-docdeploy_app}:${POSTGRES_APP_PASSWORD:-docdeploy-app-local-only}@postgres:5432/${POSTGRES_DB:-docdeploy}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-docdeploy}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-docdeploy-local-only}
      S3_BUCKET: docdeploy-private
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/database/run-migrations.js"]
    environment:
      MIGRATIONS_DATABASE_URL: postgresql://${POSTGRES_ADMIN_USER:-docdeploy_admin}:${POSTGRES_ADMIN_PASSWORD:-docdeploy-admin-local-only}@postgres:5432/${POSTGRES_DB:-docdeploy}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: docdeploy-worker:local
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-docdeploy}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-docdeploy-local-only}
      S3_BUCKET: docdeploy-private
      CLAMAV_HOST: clamav
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-docdeploy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-docdeploy-admin-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-docdeploy}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-docdeploy_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-docdeploy-app-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docdeploy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docdeploy-local-only}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_PORT:-8025}:8025"

  prometheus:
    image: prom/prometheus:v3.7.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

volumes:
  postgres-data:
  redis-data:
  minio-data:
