global:
  scrape_interval: 15s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: docdeploy-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:3000"]
  - job_name: docdeploy-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8000"]
